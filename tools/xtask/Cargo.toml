# The repository task runner behind `cargo xtask`: the verify gates, the local CI lane, dist, crate
# scaffolding and the reference manifest. Developers, agents and the orchestrator run it.
[package]
name = "xtask"
description = "The repository task runner: verify gates, the local CI lane, dist, crate scaffolding and the reference manifest."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.layout]
category = "tools"
tier = 0
targets = "any"

[dependencies]
# Errors with context for every command; xtask is a tool, so `anyhow` is allowed here.
anyhow = { workspace = true, features = ["std"] }
# Workspace members, their dependencies and their layout metadata for the crate gates.
cargo_metadata.workspace = true
# The command line: `verify <gate>`, `ci ci-local`, `dist`, `new-crate`, `reference-manifest`.
clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context"] }
# The sha256 of every reference file for the reference manifest and its gate.
sha2.workspace = true
# Manifests read for the anatomy gate and the root manifest edited by `new-crate`.
toml_edit = { workspace = true, features = ["parse", "display"] }
# The walk over the reference trees, which git does not track.
walkdir.workspace = true
# Child commands: git, cargo and the CI tools.
xshell.workspace = true

[lints]
workspace = true
