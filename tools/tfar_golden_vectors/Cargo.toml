# The golden-vector oracle: the original C++ filters and compressor and FAudio's F3DAudio, built
# with `cc` and wrapped safely, run live against the audio crates in this crate's tests.
[package]
name = "tfar_golden_vectors"
description = "The original C++ audio code and FAudio's F3DAudio as a live test oracle for the audio crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.layout]
category = "tools"
tier = 0
targets = "any"

[dependencies]
# Derives the crate's `Error`.
thiserror.workspace = true

[build-dependencies]
# Compiles DSPFilters, simpleSource, F3DAudio and the shim into the oracle library.
cc.workspace = true

[dev-dependencies]
# The shared voice DSP: sample frames, filters, compressor, HRTF, spatial gains, playback mixer.
tfar_audio.workspace = true
# Geometry and Arma value parsing.
tfar_foundation.workspace = true

[lints]
workspace = true
