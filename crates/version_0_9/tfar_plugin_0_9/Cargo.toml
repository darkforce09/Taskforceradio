# The TeamSpeak 3 plugin for the 0.9.12 mod, built as a native Linux shared library. TeamSpeak 3
# loads it from its plugins folder.
[package]
name = "tfar_plugin_0_9"
description = "The TeamSpeak 3 plugin for the 0.9.12 mod, built as a native Linux shared library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.layout]
category = "crates/version_0_9"
tier = 6
targets = "any"

# The cdylib is the file TeamSpeak loads; the rlib lets host tests and the mock host link the
# same code.
[lib]
name = "tfar_plugin_0_9"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Derives the crate's `Error`.
thiserror.workspace = true
# The safe TeamSpeak export layer and function table.
tfar_ts3_host.workspace = true
# TeamSpeak settings lookups.
tfar_ts3_settings_db.workspace = true
# The plugin-side link listener.
tfar_game_link_server.workspace = true
# The update check and Piwik calls.
tfar_web_requests.workspace = true
# The 0.9 voice frame processing.
tfar_voice_pipeline_0_9.workspace = true
# The 0.9 reception decisions.
tfar_radio_routing_0_9.workspace = true
# The 0.9 per-client state.
tfar_client_state_0_9.workspace = true
# The typed 0.9 game commands.
tfar_game_commands_0_9.workspace = true
# The 0.9 plugin command and metadata formats.
tfar_plugin_commands_0_9.workspace = true
# Radio sound playback.
tfar_playback_mixer.workspace = true
# Positions, directions and distances.
tfar_geometry.workspace = true
# The parsers for Arma's field, array and position strings.
tfar_arma_values.workspace = true
# The HRIR sphere the sound state's direction sources and the remote radio sounds render with.
tfar_hrtf.workspace = true
# The stereo scratch of the voice callbacks and the copy into and out of TeamSpeak's channels.
tfar_sample_buffer.workspace = true
# The loudspeaker, vehicle and under-water filters of the positional remote radio sounds.
tfar_dsp_filters.workspace = true
# The 0.9 simple ILD that places a remote radio sound when no HRIR sphere is loaded.
tfar_spatial_audio.workspace = true
# The per-connection state lock the audio callbacks `try_lock`, and the push-to-talk condvar.
parking_lot.workspace = true
# The stop signal of the service thread.
crossbeam-channel = { workspace = true, features = ["std"] }
# Log lines of the plugin and its game link, forwarded to TeamSpeak's log by `tfar_ts3_host`.
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
# The raw extension side of the mock-host test's game link round trip.
tfar_game_link_client.workspace = true
# The fake TeamSpeak host that loads the built `.so` in the integration test.
tfar_ts3_mock.workspace = true

[lints]
workspace = true
