# The plugin side of the game link: a localhost TCP listener that answers the extension. Used by
# `tfar_plugin_0_9`, `tfar_plugin_1_0`.
[package]
name = "tfar_game_link_server"
description = "The plugin side of the game link: a localhost TCP listener that answers the extension."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.layout]
category = "crates/game_link"
tier = 1
targets = "any"

[dependencies]
# The one FIFO queue between the session thread and the async worker.
crossbeam-channel = { workspace = true, features = ["std"] }
# The session, writer and last-message locks, which need no poison handling.
parking_lot.workspace = true
# Derives the crate's `Error`.
thiserror.workspace = true
# The game link frames, the codec, the streaming decoder and the ports.
tfar_game_link_protocol.workspace = true
# Log lines for a busy port, a refused handshake, a malformed frame and each session change.
tracing = { workspace = true, features = ["std"] }

[lints]
workspace = true
