# The extension side of the game link: a lazy, time-bounded localhost TCP client. Used by
# `tfar_extension_0_9`, `tfar_extension_1_0`, `tfar_ts3_mock`.
[package]
name = "tfar_game_link_client"
description = "The extension side of the game link: a lazy, time-bounded localhost TCP client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.layout]
category = "crates/game_link"
tier = 1
targets = "any"

[dependencies]
# Derives the crate's `Error`.
thiserror.workspace = true
# The game link frames, the `HELLO` check and the streaming frame decoder.
tfar_game_link_protocol.workspace = true
# Logs why a session closed or a connect failed; the extension app decides where the lines go.
tracing = { workspace = true, features = ["std"] }

[lints]
workspace = true
