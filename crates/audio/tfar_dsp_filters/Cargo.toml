# Butterworth and RBJ filters in f64 Direct Form II Transposed, with per-channel state. Used by
# `tfar_client_state_0_9`, `tfar_client_state_1_0`, `tfar_radio_effects_0_9`,
# `tfar_radio_effects_1_0`, `tfar_voice_pipeline_0_9`, `tfar_voice_pipeline_1_0`.
[package]
name = "tfar_dsp_filters"
description = "Butterworth and RBJ filters in f64 Direct Form II Transposed, with per-channel state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.layout]
category = "crates/audio"
tier = 1
targets = "any"

[dependencies]
# RBJ high-pass and low-pass coefficients and the Direct Form II Transposed section every filter
# runs on.
biquad.workspace = true
# Butterworth low-pass and band-pass design (`butter_dyn`) as second-order sections; `alloc` turns
# on the dynamic-order design functions.
sci-rs = { workspace = true, features = ["alloc"] }
# Derives the crate's `Error`.
thiserror.workspace = true
# The shared stereo frame type and the `i16`/`f32` scales of the original filters.
tfar_sample_buffer.workspace = true

[lints]
workspace = true
