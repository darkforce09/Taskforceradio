# Binaural direction rendering over the IRCAM HRIR sphere through the hrtf crate. Used by
# `tfar_client_state_0_9`, `tfar_client_state_1_0`, `tfar_voice_pipeline_0_9`,
# `tfar_voice_pipeline_1_0`.
[package]
name = "tfar_hrtf"
description = "Binaural direction rendering over the IRCAM HRIR sphere through the hrtf crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.layout]
category = "crates/audio"
tier = 1
targets = "any"

[dependencies]
# The listener-frame vector maths of the direction conversion.
glam = { workspace = true, features = ["std", "f64"] }
# Binaural HRIR convolution over the sphere, resampled to 48 kHz at load.
hrtf.workspace = true
# Derives the crate's `Error`.
thiserror.workspace = true
# Positions, directions and distances.
tfar_geometry.workspace = true
# The shared sample frame type and saturating gain.
tfar_sample_buffer.workspace = true

[lints]
workspace = true
