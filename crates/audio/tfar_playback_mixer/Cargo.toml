# Loading and mixing of the radio sound WAV files and the own-voice stream into the outgoing audio.
# Used by `tfar_plugin_0_9`, `tfar_plugin_1_0`, `tfar_voice_pipeline_0_9`, `tfar_voice_pipeline_1_0`.
[package]
name = "tfar_playback_mixer"
description = "Loading and mixing of the radio sound WAV files and the own-voice stream into the outgoing audio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.layout]
category = "crates/audio"
tier = 1
targets = "any"

[dependencies]
# Decodes the radio sound WAV files and reports their format.
hound.workspace = true
# The short locks on the WAV cache, the playback hand-off and the named streams.
parking_lot.workspace = true
# The wait-free queues that hand new playbacks to the audio thread and finished ones back.
rtrb.workspace = true
# Derives the crate's `Error`.
thiserror.workspace = true
# The stereo buffer a playback's processing works on.
tfar_sample_buffer.workspace = true

[lints]
workspace = true
