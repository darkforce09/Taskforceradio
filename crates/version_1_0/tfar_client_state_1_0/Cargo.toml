# The per-client state of the 1.0 plugin: positions, radios, tangents, vehicles and effect state.
# Used by `tfar_plugin_1_0`, `tfar_radio_routing_1_0`, `tfar_voice_pipeline_1_0`.
[package]
name = "tfar_client_state_1_0"
description = "The per-client state of the 1.0 plugin: positions, radios, tangents, vehicles and effect state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.layout]
category = "crates/version_1_0"
tier = 3
targets = "any"

[dependencies]
# Derives the crate's `Error`.
thiserror.workspace = true
# Positions, directions and distances.
tfar_geometry.workspace = true
# The frequency entries, stereo modes and radio subtypes the game sends.
tfar_arma_values.workspace = true
# The typed 1.0 game commands.
tfar_game_commands_1_0.workspace = true
# The 1.0 plugin commands (tangent broadcasts, client ids) and the metadata test.
tfar_plugin_commands_1_0.workspace = true
# The 1.0 radio effect chains.
tfar_radio_effects_1_0.workspace = true
# The 1.0 settings.
tfar_plugin_settings_1_0.workspace = true
# The Butterworth and RBJ filters.
tfar_dsp_filters.workspace = true
# The compressor.
tfar_dynamics.workspace = true
# Binaural direction rendering.
tfar_hrtf.workspace = true
# The stereo buffer of the object-interception delay.
tfar_sample_buffer.workspace = true

[lints]
workspace = true
