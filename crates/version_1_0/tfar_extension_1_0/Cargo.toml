# The `task_force_radio_pipe` Arma extension for the 1.0 mod, a Windows x64 DLL run under Proton.
# Arma 3 loads it through `callExtension` under Proton.
[package]
name = "tfar_extension_1_0"
description = "The task_force_radio_pipe Arma extension for the 1.0 mod, a Windows x64 DLL run under Proton."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.layout]
category = "crates/version_1_0"
tier = 1
targets = "any"

# The cdylib is the file Arma loads; the rlib lets host tests and the mock host link the
# same code.
[lib]
name = "tfar_extension_1_0"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Derives the crate's `Error`.
thiserror.workspace = true
# The Arma extension exports.
tfar_arma_extension_abi.workspace = true
# The localhost TCP game link: frames, the plugin's server, the extension's client.
tfar_game_link.workspace = true
# Debug lines for a call that did not reach the plugin; Arma installs no subscriber, so they cost
# nothing there.
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
# The localhost TCP game link: frames, the plugin's server, the extension's client.
tfar_game_link.workspace = true

[lints]
workspace = true
