# cargo-deny policy: licences, bans, sources and advisories; the gate runs `cargo deny check`.
[graph]
# The only triples the deliverables build for: Linux plugins and Windows (Proton) extensions.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu"]

[advisories]
# An ignore entry whose advisory no longer matches anything must be removed.
unused-ignored-advisory = "deny"
ignore = [
    # `paste` is archived (unmaintained), not vulnerable. It reaches us only as a proc-macro of
    # nalgebra through sci-rs, which designs filters at setup time. Exit: sci-rs leaves nalgebra 0.33.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro behind sci-rs -> nalgebra; no runtime code" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    # webpki-roots (the rustls trust store behind ureq) ships the Mozilla CA list under this licence.
    "CDLA-Permissive-2.0",
    # egui's bundled default fonts (epaint_default_fonts) for the debug window.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.93
# The allow-list is written for the external crates the library map plans, so an entry no crate in
# today's graph uses is expected, not stale.
unused-allowed-license = "allow"

# The workspace crates are `publish = false` and `UNLICENSED` until the licence is decided.
[licenses.private]
ignore = true

[bans]
# Warn while the skeletons hold no external dependency; it becomes deny once they land.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
